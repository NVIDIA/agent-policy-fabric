[workspace]
resolver = "2"
members = ["xtask", "crates/apf-types", "crates/apf-audit", "crates/apf-bundle", "crates/apf-policy-eval", "crates/apf-proto", "crates/apf-compiler", "crates/apf-policy-service", "crates/apf-compile", "crates/apf-policy-client", "crates/apf-policy-gateway", "crates/apf-openshell-projector", "crates/apf-openshell-middleware", "crates/apf-openshell-interceptor", "crates/apf-openshell-auth"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"

[workspace.dependencies]
yaml-sigil-verification = "0.5.0-rc.1"
yaml-sigil-signing      = "0.5.0-rc.1"
yaml-sigil-traits       = "0.4.0-rc.1"
