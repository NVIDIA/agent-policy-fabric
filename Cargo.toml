[workspace]
resolver = "2"
members = ["xtask", "crates/apf-types", "crates/apf-bundle", "crates/apf-policy-eval", "crates/apf-proto", "crates/apf-compiler", "crates/apf-policy-service", "crates/apf-compile", "crates/apf-policy-client", "crates/apf-policy-gateway", "crates/apf-openshell-projector", "crates/apf-openshell-middleware", "crates/apf-openshell-interceptor", "crates/apf-openshell-auth"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"

[workspace.dependencies]
yaml-sigil-verification = { version = "0.1.1-rc.3", registry = "artifactory", default-features = false, features = ["buffa", "yaml-serde-yaml"] }
yaml-sigil-signing      = { version = "0.1.1-rc.3", registry = "artifactory", default-features = false, features = ["buffa", "yaml-serde-yaml"] }
yaml-sigil-traits       = { version = "0.1.1-rc.3", registry = "artifactory", default-features = false }
