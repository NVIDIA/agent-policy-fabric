name: Feature request
description: Propose a feature, API change, or integration
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Larger changes (new features, API changes, new adapters) need maintainer
        confirmation of scope before implementation. See CONTRIBUTING.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
