version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories:
      - /deploy/docker/apf-policy-gateway
      - /deploy/docker/apf-policy-service
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
