title: "Vouch request: [your GitHub username]"
labels: []
body:
  - type: markdown
    attributes:
      value: |
        ## Vouch Request

        APF uses a vouch system for first-time contributors. Fill out this
        form to request approval. A maintainer will review and comment `/vouch`
        if approved. Approved requests are closed automatically.

        **Write in your own words.** Do not have an AI generate this request.
        Requests that read like LLM output will be denied.

  - type: textarea
    id: what
    attributes:
      label: What do you want to work on?
      description: >
        Describe the change you want to make. Link to an existing issue if
        there is one.
      placeholder: "I want to fix #123, where a bundle with an expired signature is..."
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why this change?
      description: >
        Explain your motivation and why this matters. Keep it concise.
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I wrote this request myself (not AI-generated)
          required: true
        - label: I have read [CONTRIBUTING.md](https://github.com/NVIDIA/agent-policy-fabric/blob/main/CONTRIBUTING.md)
          required: true
