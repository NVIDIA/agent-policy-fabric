# copy-pr-bot gates CI on NVIDIA self-hosted runners. See
# https://github.com/nv-gha-runners/docs/blob/main/docs/platform/apps/copy-pr-bot/index.md
# This file only takes effect once it is on the default branch.
enabled: true
# Skip CI on every push to a draft PR; a maintainer runs `/ok to test` instead.
auto_sync_draft: false
auto_sync_ready: true
