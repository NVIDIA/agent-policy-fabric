name: Setup mise
description: Install Rust from rust-toolchain.toml and the tools pinned by mise.toml and mise.lock
inputs:
  version:
    description: mise release to install
    required: false
    default: v2026.9.9
runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      shell: bash
      run: |
        set -euo pipefail
        export PATH="${CARGO_HOME:-$HOME/.cargo}/bin:$PATH"
        if ! command -v rustup > /dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
        fi
        echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
        rustup show
    - name: Restore mise cache
      id: mise-cache
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.local/share/mise
        key: mise-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}-${{ hashFiles('mise.toml', 'mise.lock') }}
        restore-keys: |
          mise-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}-
    - name: Install mise and tools
      shell: bash
      env:
        MISE_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        curl https://mise.run | sh
        export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
        mise trust --yes
        mise install --locked
    - name: Save mise cache
      if: steps.mise-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.local/share/mise
        key: ${{ steps.mise-cache.outputs.cache-primary-key }}
