name: Setup mise
description: Install mise and the tools pinned by mise.toml and mise.lock
inputs:
  version:
    description: mise release to install
    required: false
    default: v2026.9.9
runs:
  using: composite
  steps:
    - name: Restore mise cache
      id: mise-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.local/share/mise
        key: mise-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}-${{ hashFiles('mise.toml', 'mise.lock') }}
        restore-keys: |
          mise-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}-
    - name: Install mise and tools
      shell: bash
      env:
        MISE_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        curl https://mise.run | sh
        export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
        mise trust --yes
        mise install --locked
    - name: Save mise cache
      if: steps.mise-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.local/share/mise
        key: ${{ steps.mise-cache.outputs.cache-primary-key }}
