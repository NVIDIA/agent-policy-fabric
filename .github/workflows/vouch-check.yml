name: Vouch Check
# Runs on pull_request_target so it can comment on and close fork PRs. It never
# checks out or executes PR code; the PR author is treated as data only.
on:
  pull_request_target:
    types: [opened, reopened]
  merge_group:
permissions:
  contents: read
  pull-requests: write
jobs:
  vouch-gate:
    if: github.repository_owner == 'NVIDIA'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # pull_request_target checks out the base branch, never the PR head.
      - if: github.event_name == 'pull_request_target'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Check vouch status
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const { isDenounced, isVouched } = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/vouch.js`
            );

            // Skip bots (dependabot, github-actions, release-plz, ...).
            if (pr.user.type === 'Bot') {
              console.log(`${author} is a bot. Skipping vouch check.`);
              return;
            }

            // Maintainers and collaborators with write access bypass the gate.
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner, repo, username: author,
              });
              if (['admin', 'maintain', 'write'].includes(data.permission)) {
                console.log(`${author} has ${data.permission} access. Skipping vouch check.`);
                return;
              }
            } catch (e) {
              // Only "not a collaborator" is expected. Anything else (5xx, rate
              // limit) fails the job so the PR stays open and can be re-run.
              if (e.status !== 404) throw e;
              console.log(`${author} is not a collaborator.`);
            }

            // Read VOUCHED.td from the dedicated "vouched" branch, NOT the PR
            // branch: a PR author could add themselves in their fork.
            let vouched = false;
            try {
              const { data } = await github.rest.repos.getContent({
                owner, repo, path: '.github/VOUCHED.td', ref: 'vouched',
              });
              const content = Buffer.from(data.content, 'base64').toString('utf-8');
              vouched = isVouched(content, author);
              if (isDenounced(content, author)) console.log(`${author} is denounced.`);
            } catch (e) {
              // A missing file or branch (404) means nobody is vouched yet.
              // Any other error fails the job instead of closing the PR.
              if (e.status !== 404) throw e;
              console.log(`VOUCHED.td not found on "vouched": ${e.message}`);
            }

            if (vouched) {
              console.log(`${author} is in VOUCHED.td. Approved.`);
              return;
            }

            console.log(`${author} is not vouched. Closing PR.`);
            const base = `https://github.com/${owner}/${repo}`;
            await github.rest.issues.createComment({
              owner, repo,
              issue_number: pr.number,
              body: [
                `Thank you for your interest in contributing to APF, @${author}.`,
                '',
                'This project uses a **vouch system** for first-time contributors. Before submitting a pull request, you need to be vouched by a maintainer.',
                '',
                '**To get vouched:**',
                `1. Open a [Vouch Request](${base}/discussions/new?category=vouch-request) discussion.`,
                '2. Describe what you want to change and why.',
                '3. Write in your own words. Do not have an AI generate the request.',
                '4. A maintainer will comment `/vouch` if approved.',
                '5. Once vouched, open a new PR (preferred) or reopen this one after a few minutes.',
                '',
                `See [CONTRIBUTING.md](${base}/blob/main/CONTRIBUTING.md#first-time-contributors) for details.`,
              ].join('\n'),
            });
            await github.rest.pulls.update({
              owner, repo, pull_number: pr.number, state: 'closed',
            });
