#
# Asks each pull request author to sign the Developer Certificate of Origin
# once, by posting the comment in DCO_SIGN_COMMENT, and records signatures in
# dco-signatures.json on the signatures branch. Comment "recheck" on a pull
# request to run it again. Mirrors the DCO Assistant in NVIDIA/OpenShell.
#
# The action does not check the Signed-off-by line on each commit; reviewers
# do, as CONTRIBUTING.md describes. It needs an unprotected signatures branch,
# which it does not create. It never checks out pull request code, so
# pull_request_target is safe here.

name: "DCO Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

env:
  DCO_SIGN_COMMENT: "I have read the DCO document and I hereby sign the DCO."

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  DCOAssistant:
    if: github.repository_owner == 'NVIDIA' || github.repository_owner == 'NVIDIA-dev'
    runs-on: ubuntu-latest
    steps:
      - name: "DCO Assistant"
        if: |
          (github.event.comment.body == 'recheck' ||
           github.event.comment.body == env.DCO_SIGN_COMMENT) ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "dco-signatures.json"
          path-to-document: "${{ github.server_url }}/${{ github.repository }}/blob/main/DCO"
          branch: "signatures"
          create-file-commit-message: "chore: create file to store dco signatures"
          signed-commit-message: "chore: $contributorName has signed the dco in #$pullRequestNo"
          custom-notsigned-prcomment: >-
            Thank you for your submission! We ask that $you sign our
            [Developer Certificate of Origin](${{ github.server_url }}/${{ github.repository }}/blob/main/DCO)
            before we can accept your contribution. You can sign the DCO by
            adding a comment below using this text:
          custom-pr-sign-comment: ${{ env.DCO_SIGN_COMMENT }}
          lock-pullrequest-aftermerge: false
          use-dco-flag: true
