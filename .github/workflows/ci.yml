name: CI
# Pull request CI runs on self-hosted NVIDIA runners, so it never triggers on
# `pull_request` directly. copy-pr-bot copies a vetted PR head to a
# `pull-request/<N>` branch (automatically for trusted authors, after a
# maintainer `/ok to test` for forks), and the push below runs the checks.
on:
  merge_group:
  push:
    branches:
      - main
      - "pull-request/[0-9]+"
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
  MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mise-lockfile:
    name: mise lockfile
    runs-on: linux-amd64-cpu8
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-mise
      - name: Verify mise.lock is in sync with mise.toml
        run: |
          mise lock
          if ! git diff --exit-code mise.lock; then
            echo "::error::mise.lock is out of sync with mise.toml. Run 'mise lock' locally and commit the result." >&2
            exit 1
          fi

  rust-format:
    name: Rust format
    runs-on: linux-amd64-cpu8
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-mise
      - run: mise run rust:fmt:check

  cargo-lockfile:
    name: Cargo lockfile
    runs-on: linux-amd64-cpu8
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-mise
      - run: mise run rust:lockfile:check

  rust-lint:
    name: Rust lint
    runs-on: linux-amd64-cpu8
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-mise
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: mise run rust:lint

  rust-test:
    name: Rust test
    runs-on: linux-amd64-cpu8
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-mise
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: mise run rust:test

  dag-guard:
    name: Crate DAG guard
    runs-on: linux-amd64-cpu8
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-mise
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: mise run rust:dag-guard

  cargo-deny:
    name: Cargo deny (licenses, bans, sources)
    runs-on: linux-amd64-cpu8
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-mise
      - run: mise run rust:deny:policy

  license-headers:
    name: License headers
    runs-on: linux-amd64-cpu8
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-mise
      - run: mise run license-headers

  third-party-notices:
    name: Third-party notices
    runs-on: linux-amd64-cpu8
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-mise
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: mise run third-party-notices

  python-tests:
    name: Script tests
    runs-on: linux-amd64-cpu8
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-mise
      - run: mise run python:test

  contracts:
    name: Contracts (jsonschema, buf lint, vendored protos)
    runs-on: linux-amd64-cpu8
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-mise
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: mise run contracts:jsonschema
      - run: mise run contracts:lint
      - run: mise run contracts:vendor:check

  contracts-breaking:
    name: Contracts (buf breaking against main)
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: linux-amd64-cpu8
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-mise
      - run: mise run contracts:breaking
