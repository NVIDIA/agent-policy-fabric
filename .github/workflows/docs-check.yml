#
# Validates docs on PRs and pushes to main that match the path filters below.
# Runs the same checks as `mise run docs`. Uses no repository secrets and
# supports pull requests from forks.

name: Docs check

on:
  pull_request:
    paths:
      - "docs/**"
      - "fern/**"
      - "scripts/check_docs_nav.py"
      - ".github/workflows/docs-*.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "fern/**"
      - "scripts/check_docs_nav.py"
      - ".github/workflows/docs-*.yml"

permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Setup Fern CLI
        run: npm install -g fern-api

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Check docs navigation
        run: uv run scripts/check_docs_nav.py

      - name: Run fern check
        run: fern check
