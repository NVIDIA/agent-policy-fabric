name: PR title
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
permissions:
  contents: read
jobs:
  title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate title format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|test|refactor|build|ci|chore|perf|revert)(\([a-z0-9._-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title must look like 'feat(apf): add thing' or 'fix(policy-gateway): reject expired signatures'. Got: $TITLE"
            exit 1
          fi
