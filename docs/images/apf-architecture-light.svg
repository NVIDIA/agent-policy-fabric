<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 630" width="1240" height="630" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<title id="title">APF architecture</title>
<desc id="desc">Enterprise teams author policy, review it, and sign it offline. The signed bundle lands in a policy registry, either a local file or an artifact store. The APF policy service reads and verifies the bundle and projects it for each enforcement point. The policy gateway, an APF adapter, receives the projections. Its OpenShell interceptor works with the OpenShell gateway at sandbox admission. Its OpenShell middleware can receive each governed request from the OpenShell supervisor, and the decision layer evaluates it. The decision layer can look up facts from policy information providers registered with the gateway, which run outside APF. The supervisor enforces each decision for the sandboxed agent workload. Other enforcement points are envisioned but not yet built. Every APF component writes audit events joined by correlation ID and bundle digest.</desc>
