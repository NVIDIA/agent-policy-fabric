# Third-party protobuf sources vendored under contracts/third_party/<name>/proto.
# Each entry is exported with `buf export "<repository>#ref=<ref>,subdir=<subdir>"`.
# Edit a ref here, then run `cargo xtask vendor-protos` and commit the result;
# `cargo xtask vendor-protos --check` verifies the tree matches these pins.

[[pin]]
name = "openshell"
repository = "https://github.com/NVIDIA/OpenShell.git"
ref = "e1f3c82caa3ed3b65de22889ae7ef32a774878ef" # v0.1.3
subdir = "proto"
license = "Apache-2.0"

[[pin]]
name = "yaml-sigil"
repository = "https://github.com/NVIDIA/yaml-sigil-spec.git"
ref = "2d2cc300d4f716c9e18a8600c84907ba8107bf7e"
subdir = "proto"
license = "Apache-2.0"
