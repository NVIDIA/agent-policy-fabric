#
# OpenShell gateway, Docker compute driver, with APF registered for sandbox
# admission (gateway interceptor), egress request policy (supervisor
# middleware) and as the provider-profile source. Mounted read-only at
# /etc/openshell/gateway.toml by e2e/configs/compose/compose.openshell.yaml.
# The ports, gateway id, audiences and images below are the defaults;
# e2e/support/compose-stack.sh renders an environment-adjusted copy into the
# work directory before use.

[openshell]
version = 2

[openshell.gateway]
# The gateway shares the pod's network namespace; the pod publishes these two
# ports on 127.0.0.1.
bind_address        = "0.0.0.0:8080"
health_bind_address = "0.0.0.0:8081"
log_level           = "info"
compute_driver      = "docker"
disable_tls         = true
provider_profile_sources = [{ type = "interceptor", name = "apf/policy-adapter" }]

# Plaintext and unauthenticated users: a verification fixture, not a deployment.
[openshell.gateway.auth]
allow_unauthenticated_users = true

# Extension-JWT material the wrapper generates into the openshell-jwt volume;
# the gateway id is the issuer suffix APF's trust profiles expect
# (openshell-gateway:<gateway_id>).
[openshell.gateway.gateway_jwt]
signing_key_path = "/etc/openshell-extensions/apf/jwt/signing.pem"
public_key_path  = "/etc/openshell-extensions/apf/jwt/public.pem"
kid_path         = "/etc/openshell-extensions/apf/jwt/kid"
gateway_id       = "apf-compose"

# Sandbox admission: the policy-gateway listener inside the pod namespace.
[[openshell.gateway.interceptors]]
name             = "apf/policy-adapter"
grpc_endpoint    = "https://127.0.0.1:18081"
audience         = "urn:openshell:extension:interceptor:apf-compose"
tls_ca_cert_path = "/etc/openshell-extensions/apf/ca.crt"
order            = 0
failure_policy   = "fail_closed"

# Egress request policy: reached by the gateway through the pod's
# host.openshell.internal alias and by the host-network supervisor through
# the port the pod publishes on 127.0.0.1.
[[openshell.supervisor.middleware]]
name              = "apf-content-policy"
grpc_endpoint     = "https://host.openshell.internal:9099"
audience          = "urn:openshell:extension:middleware:apf-compose"
tls_ca_cert_path  = "/etc/openshell-extensions/apf/ca.crt"
max_payload_bytes = 4194304
timeout           = "10s"

[openshell.drivers.docker]
socket_path           = "/run/container-engine/engine.sock"
default_image         = "ghcr.io/nvidia/openshell-community/sandboxes/base@sha256:e29a8e98c1399aa08a8c624d758d1814b6edbe0302eb570c0468a6d3e811d167"
supervisor_image      = "ghcr.io/nvidia/openshell/supervisor:0.1.3"
sandbox_runtime_image = "ghcr.io/nvidia/openshell/sandbox:0.1.3"
image_pull_policy     = "if_not_present"
sandbox_label         = "apf-compose"
# Loopback keeps the supervisor's host.openshell.internal alias on 127.0.0.1,
# where the pod publishes the gateway and the egress listener.
grpc_endpoint         = "http://127.0.0.1:8080"
