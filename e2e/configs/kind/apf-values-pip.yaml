#
# Policy information provider lane for the kind verification run.
# e2e/with-kind-stack.sh --pip adds this file after apf-values.yaml, because
# ConfigMaps apf-pip and apf-pip-stub exist only then, and renders a copy with
# the sidecar image and health path from the environment. Helm replaces
# lists, so the rendered copy also carries the evaluate-proto extraVolumes
# entry of the base values.
#
# The gateway accepts plain-http providers on loopback only, so the provider
# behind the registration runs as a sidecar in the APF pod. The ConfigMap key
# stub.py holds whatever script PIP_STUB_SRC names; it must accept --port.
policyGateway:
  pip:
    configMap: apf-pip
    key: pips.yaml

extraVolumes:
  - name: pip-stub-script
    configMap:
      name: apf-pip-stub

extraContainers:
  - name: pip-stub
    # python 3.12-slim, pinned by digest; the wrapper renders the node-side
    # tag it loaded into the cluster.
    image: python@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
    imagePullPolicy: IfNotPresent
    command: ["python3", "/app/stub.py", "--port", "19500"]
    env:
      - name: PYTHONDONTWRITEBYTECODE
        value: "1"
      - name: PIP_STUB_HEALTH_URL
        value: http://127.0.0.1:19500/healthz
    securityContext:
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
    readinessProbe:
      exec:
        command:
          - python3
          - -c
          - "import os, sys, urllib.request; sys.exit(0 if urllib.request.urlopen(os.environ['PIP_STUB_HEALTH_URL'], timeout=2).status == 200 else 1)"
      periodSeconds: 5
    volumeMounts:
      - name: pip-stub-script
        mountPath: /app
        readOnly: true
