# Type Name ID GECOS Home directory Shell
#
# apf-policy-service and apf-policy-gateway share one system account.
# apf-policy-service.sock is created mode 0600 (owner-only) by the daemon
# itself at bind time, so cross-process UDS access is only possible when
# both daemons run as the same UID. SO_PEERCRED gating (--allowed-uid,
# defaults to the listener's own UID) is a second, independent check on
# top of that filesystem restriction — do not split this into two users
# without also changing the daemons to grant the peer UID socket access.
u apf - "Agent Policy Fabric" /var/lib/apf -
