suite: service account
templates:
  - templates/serviceaccount.yaml
  - templates/deployment.yaml
  - templates/policy-inputs.yaml
tests:
  - it: creates a dedicated account without API credentials
    template: templates/serviceaccount.yaml
    release:
      name: example
    asserts:
      - equal:
          path: metadata.name
          value: example-apf
      - equal:
          path: automountServiceAccountToken
          value: false
  - it: attaches the dedicated account to the workload
    template: templates/deployment.yaml
    release:
      name: example
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: example-apf
  - it: supports a pre-provisioned account without creating one
    template: templates/serviceaccount.yaml
    set:
      serviceAccount.create: false
      serviceAccount.name: existing-apf
    asserts:
      - hasDocuments:
          count: 0
  - it: uses the pre-provisioned account without mounting a token
    template: templates/deployment.yaml
    set:
      serviceAccount.create: false
      serviceAccount.name: existing-apf
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: existing-apf
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
