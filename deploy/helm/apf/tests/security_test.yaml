suite: pod and container security
templates:
  - templates/deployment.yaml
  - templates/policy-inputs.yaml
tests:
  - it: applies restricted security defaults to both services and preparation
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 65532
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 65532
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.capabilities.drop
          value: [ALL]
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[1].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
  - it: supports OpenShift with null UID GID and fsGroup values
    template: templates/deployment.yaml
    set:
      podSecurityContext.fsGroup: null
      podSecurityContext.runAsUser: null
      podSecurityContext.runAsGroup: null
    asserts:
      - equal:
          value: null
          path: spec.template.spec.securityContext.fsGroup
      - equal:
          value: null
          path: spec.template.spec.securityContext.runAsUser
      - equal:
          value: null
          path: spec.template.spec.securityContext.runAsGroup
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
  - it: keeps the openshift convenience flag compatible with assigned identities
    template: templates/deployment.yaml
    set:
      openshift: true
    asserts:
      - notExists:
          path: spec.template.spec.securityContext.fsGroup
      - notExists:
          path: spec.template.spec.securityContext.runAsUser
      - notExists:
          path: spec.template.spec.securityContext.runAsGroup
  - it: accepts pod labels without allowing selector labels to be replaced
    template: templates/deployment.yaml
    set:
      podLabels:
        team: policy
        app.kubernetes.io/name: ignored
    asserts:
      - equal:
          path: spec.template.metadata.labels.team
          value: policy
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: apf
