{{- /* SPDX-License-Identifier: Apache-2.0 */ -}}
{{- $openshell := .Values.policyGateway.openshell }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "apf.fullname" . }}
  labels: {{- include "apf.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "apf.selectorLabels" . | nindent 4 }}
  ports:
    - name: admission
      port: {{ $openshell.admission.port }}
      targetPort: admission
      protocol: TCP
    {{- if $openshell.egress.enabled }}
    - name: egress
      port: {{ $openshell.egress.port }}
      targetPort: egress
      protocol: TCP
    {{- end }}
