apiVersion: v1
kind: Service
metadata:
  name: {{ include "apf.fullname" . }}
  labels: {{- include "apf.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "apf.selectorLabels" . | nindent 4 }}
  ports:
    - name: interceptor
      port: {{ .Values.interceptor.port }}
      targetPort: interceptor
      protocol: TCP
    {{- if eq (int .Values.tier) 2 }}
    - name: middleware
      port: {{ .Values.middleware.port }}
      targetPort: middleware
      protocol: TCP
    {{- end }}
