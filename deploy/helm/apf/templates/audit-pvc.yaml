{{- /* SPDX-License-Identifier: Apache-2.0 */ -}}
{{- $audit := .Values.persistence.audit }}
{{- if $audit.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "apf.fullname" . }}-audit
  labels: {{- include "apf.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if $audit.storageClass }}
  storageClassName: {{ $audit.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ $audit.size }}
{{- end }}
