{{- /* SPDX-License-Identifier: Apache-2.0 */ -}}
{{- $bundleSource := include "apf.bundleSource" . }}

{{- if and (eq $bundleSource "local") (not .Values.bundle.existingConfigMap) }}
{{- if and .Values.bundle.tarGz .Values.bundle.file }}{{ fail "set only one of bundle.tarGz or bundle.file" }}{{- end }}
{{- $bundleBytes := .Values.bundle.tarGz -}}
{{- if .Values.bundle.file -}}
{{- $bundleBytes = required (printf "bundle.file %s not found" .Values.bundle.file) (.Files.Get .Values.bundle.file) -}}
{{- end -}}
{{- if not $bundleBytes }}{{ fail "bundle.existingConfigMap, bundle.tarGz, or bundle.file is required" }}{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "apf.bundleConfigMap" . }}
  labels: {{- include "apf.labels" . | nindent 4 }}
binaryData:
  {{ .Values.bundle.tarKey }}: {{ $bundleBytes | b64enc }}
{{- end }}

{{- if not .Values.trustRoot.existingConfigMap }}
{{- if not .Values.trustRoot.keys }}{{ fail "trustRoot.existingConfigMap or trustRoot.keys is required" }}{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "apf.trustConfigMap" . }}
  labels: {{- include "apf.labels" . | nindent 4 }}
data:
{{- range $k, $v := .Values.trustRoot.keys }}
  {{ $k }}: |
{{ $v | indent 4 }}
{{- end }}

{{- end }}
