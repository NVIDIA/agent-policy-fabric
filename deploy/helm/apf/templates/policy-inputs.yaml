{{- /* SPDX-License-Identifier: Apache-2.0 */ -}}
{{- $bundleSource := include "apf.bundleSource" . }}
{{- $local := .Values.policyService.bundle.local }}
{{- $trustRoot := .Values.policyService.trustRoot }}

{{- if and (eq $bundleSource "local") (not $local.existingConfigMap) }}
{{- if and $local.tarGz $local.file }}{{ fail "set only one of policyService.bundle.local.tarGz or policyService.bundle.local.file" }}{{- end }}
{{- $bundleBytes := $local.tarGz -}}
{{- if $local.file -}}
{{- $bundleBytes = required (printf "policyService.bundle.local.file %s not found" $local.file) (.Files.Get $local.file) -}}
{{- end -}}
{{- if not $bundleBytes }}{{ fail "policyService.bundle.local.existingConfigMap, tarGz, or file is required" }}{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "apf.bundleConfigMap" . }}
  labels: {{- include "apf.labels" . | nindent 4 }}
binaryData:
  {{ $local.tarKey }}: {{ $bundleBytes | b64enc }}
{{- end }}

{{- if not $trustRoot.existingConfigMap }}
{{- if not $trustRoot.keys }}{{ fail "policyService.trustRoot.existingConfigMap or policyService.trustRoot.keys is required" }}{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "apf.trustConfigMap" . }}
  labels: {{- include "apf.labels" . | nindent 4 }}
data:
{{- range $k, $v := $trustRoot.keys }}
  {{ $k }}: |
{{ $v | indent 4 }}
{{- end }}

{{- end }}
