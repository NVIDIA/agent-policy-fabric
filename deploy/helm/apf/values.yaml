# Default values for the APF chart. Keys marked (prerequisite) name Secrets or
# ConfigMaps created outside the chart before installation.
#
# Topology: this chart runs the policy service and the policy gateway as two
# containers in one pod sharing a Unix socket (the co-located model). The
# target deployment separates them: the policy service runs centrally and
# serves many gateways over the network, and each policy gateway runs next to
# the OpenShell gateway it governs, or centrally as well when latency and the
# features in use allow. That split needs the networked policy-service
# transport, which does not exist yet, so this chart does not offer it.

global:
  image:
    # -- Shared image registry; a component registry takes precedence.
    registry: ""
    # -- Shared image tag; a component tag takes precedence. Empty uses the chart appVersion.
    tag: ""
    # -- Shared image pull policy; a component pull policy takes precedence.
    pullPolicy: IfNotPresent
  # -- Image pull Secret references for every container in the pod (prerequisite).
  imagePullSecrets: []

# -- Replaces the chart name in resource names and labels.
nameOverride: ""
# -- Replaces the release-derived resource name.
fullnameOverride: ""

# Policy service (PAP): verifies the signed bundle, serves projections, and
# mints provenance documents. Its image also runs the prepare init container.
policyService:
  image:
    # -- Policy service image registry. Empty uses global.image.registry.
    registry: ""
    # -- Policy service image repository; the default is a local build name.
    repository: apf-policy-service
    # -- Policy service image tag. Empty uses the chart appVersion.
    tag: ""
    # -- Policy service image digest. When set, this takes precedence over tag.
    digest: ""
    # -- Policy service image pull policy. Null uses global.image.pullPolicy.
    pullPolicy: null
  # -- CPU and memory requests and limits for the policy service container.
  resources: {}
  # -- CPU and memory requests and limits for the prepare init container.
  prepareResources: {}
  http:
    # -- Loopback HTTP port serving readiness and JWKS.
    port: 19200
    # -- Secret with key token for protected HTTP routes (prerequisite).
    tokenSecret: apf-runtime
  signing:
    # -- Secret holding the document signing seed (prerequisite).
    existingSecret: apf-runtime
    # -- Key of the signing seed in that Secret.
    keyFile: document-signing.seed
    # -- Key ID attached to signed documents.
    keyId: apf
  # -- Signed document lifetime in seconds; 0 keeps the binary default.
  documentTtlSecs: 0
  # -- Policy projection surfaces the service compiles.
  surfaces:
    - openshell.sandbox.v1
    - openshell.provider-profile.v1
    - apf.policy.v1
  bundle:
    # -- Signed bundle source: local loads one tarball from a ConfigMap, http polls a URL.
    source: local
    local:
      # -- ConfigMap holding the signed tarball (prerequisite). Empty creates one from tarGz or file.
      existingConfigMap: apf-bundle
      # -- Tarball bytes supplied with --set-file when existingConfigMap is empty.
      tarGz: ""
      # -- Tarball path packaged inside the chart when existingConfigMap is empty.
      file: ""
      # -- Tarball key in the bundle ConfigMap.
      tarKey: bundle.tar.gz
      # -- Manifest path inside the extracted tarball.
      manifest: bundle/manifest.yaml
    http:
      # -- Signed tarball URL; required when source is http.
      url: ""
      # -- Seconds between polls of the URL.
      pollIntervalSeconds: 30
      # -- Secret holding a bearer token for the URL (prerequisite); empty sends none.
      tokenSecret: ""
      # -- Token key in that Secret.
      tokenKey: token
  trustRoot:
    # -- ConfigMap of public bundle-signing keys (prerequisite). Empty creates one from keys.
    existingConfigMap: apf-trust
    # -- Public keys by key ID for a chart-created ConfigMap; never private keys.
    keys: {}
  # -- Arguments appended after the chart-managed flags.
  extraArgs: []
  # -- Environment variable entries appended to the container.
  extraEnv: []
  # -- Volume mounts appended to the container.
  extraVolumeMounts: []

# Policy gateway (PDP) with two OpenShell-facing features: sandbox admission
# (registered as a gateway interceptor) and egress request policy (registered
# as supervisor middleware).
policyGateway:
  image:
    # -- Policy gateway image registry. Empty uses global.image.registry.
    registry: ""
    # -- Policy gateway image repository; the default is a local build name.
    repository: apf-policy-gateway
    # -- Policy gateway image tag. Empty uses the chart appVersion.
    tag: ""
    # -- Policy gateway image digest. When set, this takes precedence over tag.
    digest: ""
    # -- Policy gateway image pull policy. Null uses global.image.pullPolicy.
    pullPolicy: null
  # -- CPU and memory requests and limits for the policy gateway container.
  resources: {}
  document:
    # -- Signed document kind the gateway requests.
    kind: openshell.sandbox.v1
    # -- Signed document name the gateway requests.
    name: default
  openshell:
    # -- OpenShell gateway URL for outbound callbacks; empty makes none.
    gatewayEndpoint: ""
    admission:
      # -- Sandbox admission (OpenShell gateway interceptor): Service and container port of its listener.
      port: 18081
      # -- Sandbox admission (OpenShell gateway interceptor): Secret with tls.crt, tls.key, and trust.toml (prerequisite).
      tlsSecret: apf-runtime
      # -- Sandbox admission (OpenShell gateway interceptor): serves the listener without TLS; isolated local development only.
      allowInsecureTransport: false
    egress:
      # -- Egress request policy (OpenShell supervisor middleware): exposes its listener.
      enabled: false
      # -- Egress request policy (OpenShell supervisor middleware): Service and container port of its listener.
      port: 9099
      # -- Egress request policy (OpenShell supervisor middleware): Secret with tls.crt, tls.key, and trust.toml (prerequisite); required when enabled.
      tlsSecret: ""
  pip:
    # -- ConfigMap holding the policy information provider registration (prerequisite); empty disables enrichment.
    configMap: ""
    # -- Registration file key in that ConfigMap.
    key: pips.yaml
    # -- Cap on the enrichment stage in milliseconds; 0 keeps the binary default.
    stageBudgetMs: 0
  # -- Arguments appended after the chart-managed flags.
  extraArgs: []
  # -- Environment variable entries appended to the container.
  extraEnv: []
  # -- Volume mounts appended to the container.
  extraVolumeMounts: []

persistence:
  state:
    # -- Creates a PVC for antirollback counters; false uses emptyDir and loses them on pod replacement.
    enabled: true
    # -- Keeps the state PVC when the release is uninstalled.
    retain: true
    # -- Capacity request of the state PVC.
    size: 1Gi
    # -- StorageClass of the state PVC; empty uses the cluster default.
    storageClass: ""
  audit:
    # -- Creates a PVC for audit files; false uses emptyDir.
    enabled: false
    # -- Capacity request of the audit PVC.
    size: 1Gi
    # -- StorageClass of the audit PVC; empty uses the cluster default.
    storageClass: ""
    # -- Audit directory mounted in both containers.
    mountPath: /var/log/apf/audit
    # -- Size limit of the audit emptyDir in MiB; 0 leaves it unbounded.
    emptyDirSizeLimitMi: 0

serviceAccount:
  # -- Creates a ServiceAccount for the pod; its token is never mounted.
  create: true
  # -- ServiceAccount name; empty derives it from the release, or names an existing one when create is false.
  name: ""
  # -- Annotations on the created ServiceAccount.
  annotations: {}

service:
  # -- Kubernetes Service type.
  type: ClusterIP
  # -- Annotations on the Service.
  annotations: {}

networkPolicy:
  # -- Creates a NetworkPolicy admitting ingress to the listeners only from the peers below.
  enabled: false
  # -- Sandbox admission (OpenShell gateway interceptor): NetworkPolicyPeer entries allowed to reach its port.
  admissionFrom: []
  # -- Egress request policy (OpenShell supervisor middleware): NetworkPolicyPeer entries allowed to reach its port.
  egressFrom: []

rollout:
  # -- Any string; change it to restart the pod after an external Secret or ConfigMap changes.
  revision: ""
  # -- Pod annotation carrying the revision.
  annotationKey: apf-rollout-revision

# -- Omits explicit UID and GID so OpenShift assigns them.
openshift: false
podSecurityContext:
  # -- Pod user ID; applied unless openshift is true.
  runAsUser: 65532
  # -- Pod group ID; applied unless openshift is true.
  runAsGroup: 65532
  # -- Pod filesystem group; applied unless openshift is true.
  fsGroup: 65532

# -- Annotations on the pod template.
podAnnotations: {}
# -- Labels on the pod template.
podLabels: {}
# -- Node labels the pod must match.
nodeSelector: {}
# -- Pod tolerations.
tolerations: []
# -- Pod affinity rules.
affinity: {}
# -- Volumes appended to the pod.
extraVolumes: []
# -- Sidecar containers appended to the pod, such as a loopback policy information provider.
extraContainers: []
