#
# OpenShell fixture for the APF chart verification harness: a plaintext
# development gateway on kind. up.sh overrides the image tag and sandbox image
# from the environment; these are the defaults it assumes.
global:
  image:
    tag: "0.1.3"
    pullPolicy: IfNotPresent

sandbox:
  image:
    repository: nvcr.io/nvidia/base/ubuntu
    tag: "24.04"

server:
  # Plaintext listener; the harness talks to the gateway through a port-forward.
  disableTls: true
  auth:
    allowUnauthenticatedUsers: true

# The certgen hook creates the extension-JWT signing Secret (<release>-jwt-keys)
# that materials.sh reads to build the APF trust profiles. Keep it on.
pkiInitJob:
  enabled: true
