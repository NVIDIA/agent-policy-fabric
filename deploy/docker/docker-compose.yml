# SPDX-License-Identifier: Apache-2.0
# APF developer compose — builds from source and runs the policy stack locally.
#
# Usage (from repo root):
#   mise run dev          # build images + start
#   mise run dev-logs     # tail all logs
#   mise run dev-down     # stop + remove containers
#   mise run dev-native   # run services natively without Docker (cargo run)
#
# The demo bundle (examples/demo-bundle/demo-bundle.yaml) is pre-signed with the
# dev key and committed alongside the template. Re-sign after policy changes:
#   mise run sign-bundle
#
# apf-policy-service refuses to start with APF_HTTP_ADDR set unless
# APF_HTTP_BEARER_TOKEN_FILE is also set (see ../systemd/SECURITY.md) — this
# stack points it at examples/dev-keys/http-bearer-token.dev, a
# zero-security-value dev-only file committed alongside the dev signing key.
# /healthz and /readyz don't need it either way.
#
# The OpenShell-facing interceptor/middleware surfaces are enabled here via
# the documented insecure-transport opt-out (see ../systemd/SECURITY.md) —
# this loopback-only dev stack has no OpenShell gateway to issue TLS/caller
# trust against, so it opts out explicitly rather than bootstrapping
# throwaway fixtures. Production deployments must not set these two flags —
# see ../systemd/ for the fully authenticated deployment.
#
# Note: locally-built macOS binaries cannot be mounted into Linux containers.
# This compose always builds images; the Dockerfile build cache makes rebuilds fast.
#
# Once up:
#   curl localhost:19200/healthz

name: apf-dev

services:

  policy-service:
    build:
      context: ../..
      dockerfile: deploy/docker/apf-policy-service/Dockerfile
      target: runtime
      secrets:
        - artifactory_token
    environment:
      APF_SOCKET:          /run/apf/policy-service.sock
      APF_HTTP_ADDR:       0.0.0.0:19200
      APF_HTTP_BEARER_TOKEN_FILE: /app/keys/http-bearer-token.dev
      APF_BUNDLE_PATH:     /app/bundle/demo-bundle.yaml
      APF_TRUST_ROOT_DIR:  /app/keys
      APF_COUNTER_STORE:   /tmp/apf-counter
      APF_DOCUMENT_SIGNING_KEY: /app/keys/apf-dev.seed
      APF_DOCUMENT_KEY_ID:      apf-dev
      APF_POLICY_SOURCE:        local
      APF_SURFACES:        openshell.sandbox.v1,openshell.provider-profile.v1,apf.policy.v1
      RUST_LOG:            ${APF_LOG:-apf_policy_service=debug,warn}
    volumes:
      - ../../examples/demo-bundle:/app/bundle:ro
      - ../../examples/dev-keys:/app/keys:ro
      - apf-sock:/run/apf
    ports:
      - "127.0.0.1:19200:19200"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:19200/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  policy-gateway:
    build:
      context: ../..
      dockerfile: deploy/docker/apf-policy-gateway/Dockerfile
      secrets:
        - artifactory_token
    environment:
      APF_GATEWAY_SOCKET:             /run/apf-gateway/policy-gateway.sock
      APF_POLICY_SERVICE_SOCKET:      /run/apf/policy-service.sock
      APF_TRUST_ROOT_DIR:             /app/keys
      APF_COUNTER_STORE:              /tmp/apf-gw-counter
      APF_DOCUMENT_KEY_ID:            apf-dev
      APF_JWKS_URL:                   http://policy-service:19200/.well-known/jwks.json
      APF_OPENSHELL_INTERCEPTOR_ADDR: 0.0.0.0:18202
      APF_OPENSHELL_MIDDLEWARE_ADDR:  0.0.0.0:9099
      # This loopback-only demo intentionally opts out of extension TLS and caller authentication.
      APF_OPENSHELL_INTERCEPTOR_ALLOW_INSECURE_TRANSPORT: "true"
      APF_OPENSHELL_MIDDLEWARE_ALLOW_INSECURE_TRANSPORT: "true"
      RUST_LOG:                       ${APF_LOG:-apf_policy_gateway=debug,warn}
    volumes:
      - ../../examples/dev-keys:/app/keys:ro
      - apf-sock:/run/apf
      - gateway-sock:/run/apf-gateway
    ports:
      - "127.0.0.1:18202:18202"   # interceptor gRPC
      - "127.0.0.1:9099:9099"     # middleware gRPC
    depends_on:
      policy-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/apf-gateway/policy-gateway.sock"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  apf-sock:     # policy-service.sock shared between policy-service and policy-gateway
  gateway-sock: # policy-gateway EvaluationService UDS

secrets:
  artifactory_token:
    environment: CARGO_REGISTRIES_ARTIFACTORY_TOKEN

networks:
  default:
    name: apf-dev
