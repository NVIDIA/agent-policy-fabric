# Tool pins and task definitions. `mise install --locked` installs the tools
# below at the versions recorded in mise.lock; tasks live in tasks/*.toml.
# Rust itself is pinned by rust-toolchain.toml.

[settings]
experimental = true
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64"]
python.precompiled_flavor = "install_only_stripped"

[tools]
buf = "1.72.0"
protoc = "29.6"
python = "3.14.5"
uv = "0.13.1"
"github:EmbarkStudios/cargo-deny" = { version = "0.20.2", version_prefix = "" }
"github:nextest-rs/nextest" = { version = "0.9.143", version_prefix = "cargo-nextest-" }

[task_config]
includes = ["tasks/*.toml"]
