apiVersion: nvidia.agent-policy-fabric.policy/v1alpha1
kind: Provider
metadata:
  name: github
  title: GitHub
  description: GitHub REST API — read-only access to repositories and issues.

spec:
  type: source-control
  endpoints:
    - host: api.github.com
      port: 443
      protocol: rest
      access: read-only
      enforcement: enforce
  binaries:
    - /usr/bin/gh
    - /usr/bin/git
  credentials:
    - name: api_token
      envVars:
        - GITHUB_TOKEN
      required: true
      style: bearer
      header: Authorization
      source:
        kind: host-env
        name: GITHUB_TOKEN
