# SPDX-License-Identifier: Apache-2.0
apiVersion: nvidia.agent-policy-fabric.policy/v1alpha1
kind: Provider
metadata:
  name: claude-code
  title: Claude (Anthropic)
  description: Anthropic Claude — inference provider for the agent sandbox.

spec:
  type: claude-code
  endpoints:
    - host: integrate.api.nvidia.com
      port: 443
      protocol: rest
      access: read-write
      enforcement: enforce
  credentials:
    - name: api_key
      envVars:
        - ANTHROPIC_API_KEY
      required: true
      style: bearer
      header: x-api-key
      source:
        kind: host-env
        name: INFERENCE_API_KEY
