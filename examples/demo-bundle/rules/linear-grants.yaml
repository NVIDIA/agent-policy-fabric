# SPDX-License-Identifier: Apache-2.0
# Linear tool grants — data-driven Cedar PolicyRule.
# spec.data carries the approved team and project; Cedar references them via
# context.data so changing the allowlist only requires a data update,
# not a Cedar rule edit. Same pattern can express multi-team allowlists when
# Cedar adds set containment support.
apiVersion: nvidia.agent-policy-fabric.policy/v1alpha1
kind: PolicyRule
metadata:
  name: linear-grants
spec:
  description: Grants for Linear tool capabilities via the network egress gateway. Team/project constraints are data-driven.
  language: cedar
  role: capability
  data:
    approved_team: "Agent Policy Fabric"
    approved_project: "APF Policy Demo"
  definition: |
    @id("linear-grants/list_issues")
    permit (
      principal,
      action == APF::Action::"linear::list_issues",
      resource
    )
    when {
      context.args.team == context.data.approved_team &&
      context.args.project == context.data.approved_project
    };

    @id("linear-grants/get_issue")
    permit (
      principal,
      action == APF::Action::"linear::get_issue",
      resource
    );

    @id("linear-grants/list_teams")
    permit (
      principal,
      action == APF::Action::"linear::list_teams",
      resource
    );

    @id("linear-grants/list_projects")
    permit (
      principal,
      action == APF::Action::"linear::list_projects",
      resource
    );
