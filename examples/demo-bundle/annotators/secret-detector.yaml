# SPDX-License-Identifier: Apache-2.0
apiVersion: nvidia.agent-policy-fabric.policy/v1alpha1
kind: PolicyAnnotator
metadata:
  name: secret-detector

spec:
  description: Detects known credential shapes in request and result body text.
  annotations:
    - name: secret_detected
      output: bool
      set_true_if: any
      rules:
        - field: body_text
          op: regex_match
          pattern: 'sk-[A-Za-z0-9_-]{16,}'
        - field: body_text
          op: regex_match
          pattern: 'ghp_[A-Za-z0-9]{36}'
        - field: body_text
          op: regex_match
          pattern: '-----BEGIN.*PRIVATE KEY-----'
        - field: body_text
          op: regex_match
          pattern: 'eyJ[A-Za-z0-9_-]{10,}\.eyJ'
        - field: body_text
          op: regex_match
          pattern: 'AKIA[0-9A-Z]{16}'
        - field: body_text
          op: regex_match
          pattern: 'APF-DEMO-STRING-\d+'

    - name: secret_kind
      output: string
      set_value_from: first_match
      rules:
        - field: body_text
          op: regex_match
          pattern: 'sk-[A-Za-z0-9_-]{16,}'
          value: openai_key
        - field: body_text
          op: regex_match
          pattern: 'ghp_[A-Za-z0-9]{36}'
          value: github_pat
        - field: body_text
          op: regex_match
          pattern: '-----BEGIN.*PRIVATE KEY-----'
          value: private_key
        - field: body_text
          op: regex_match
          pattern: 'eyJ[A-Za-z0-9_-]{10,}\.eyJ'
          value: jwt
        - field: body_text
          op: regex_match
          pattern: 'AKIA[0-9A-Z]{16}'
          value: aws_access_key
        - field: body_text
          op: regex_match
          pattern: 'APF-DEMO-STRING-\d+'
          value: demo_secret
