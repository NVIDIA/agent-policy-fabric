[package]
name = "apf-openshell-middleware"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
apf-audit                = { path = "../apf-audit" }
apf-openshell-auth = { path = "../apf-openshell-auth" }
apf-policy-eval     = { path = "../apf-policy-eval" }
apf-proto           = { path = "../apf-proto" }
base64     = "0.22"
hex        = "0.4"
sha2       = "0.11"
prost      = "0.13"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror  = "2"
tokio      = { version = "1", features = ["full"] }
tonic      = { version = "0.12", features = ["channel"] }
tracing    = "0.1"

[dev-dependencies]
tempfile = "3"
