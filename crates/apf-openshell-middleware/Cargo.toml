[package]
name = "apf-openshell-middleware"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
apf-policy-eval = { path = "../apf-policy-eval" }
apf-proto       = { path = "../apf-proto" }

anyhow     = "1"
base64     = "0.22"
hex        = "0.4"
jsonwebtoken = "9"
nix        = { version = "0.29", features = ["fs"] }
sha2       = "0.10"
prost      = "0.13"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror  = "2"
tokio      = { version = "1", features = ["full"] }
toml       = "0.8"
tonic      = { version = "0.12", features = ["channel"] }
tracing    = "0.1"

[dev-dependencies]
tempfile = "3"
