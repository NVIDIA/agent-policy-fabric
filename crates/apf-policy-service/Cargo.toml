[package]
name = "apf-policy-service"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "apf-policy-service"
path = "src/main.rs"

[dependencies]
apf-audit                = { path = "../apf-audit" }
apf-bundle               = { path = "../apf-bundle" }
apf-compiler             = { path = "../apf-compiler" }
apf-openshell-projector  = { path = "../apf-openshell-projector" }
apf-proto     = { path = "../apf-proto" }
apf-types     = { path = "../apf-types" }

anyhow         = "1"
arc-swap       = "1"
async-trait    = "0.1"
axum           = "0.8"
base64         = "0.22"
clap           = { version = "4", features = ["derive", "env"] }
ed25519-dalek  = { version = "3", features = ["rand_core"] }
getrandom      = { version = "0.4", features = ["sys_rng"] }
flate2         = "1"
hex            = "0.4"
jsonwebtoken   = { version = "11.1.0", features = ["rust_crypto"] }
nix            = { version = "0.29", features = ["socket", "user"] }
prost          = "0.13"
reqwest        = { version = "0.12", features = ["json"] }
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
serde_yaml     = "0.9"
sha2           = "0.11"
tar            = "0.4"
tempfile       = "3"
thiserror      = "2"
tokio          = { version = "1", features = ["full"] }
tokio-stream   = "0.1"
tonic          = { version = "0.12", features = ["channel"] }
toml           = "0.8"
tracing        = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid           = { version = "1", features = ["v4"] }

