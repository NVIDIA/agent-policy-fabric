[package]
name = "apf-bundle"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
apf-types = { path = "../apf-types" }

base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
ed25519-dalek = { version = "3", features = ["rand_core"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
hex = "0.4"
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"

yaml-sigil-core         = "0.6.0"
yaml-sigil-verification = { workspace = true }
yaml-sigil-traits       = { workspace = true }

[dev-dependencies]
tempfile           = "3"
yaml-sigil-signing = { workspace = true }
