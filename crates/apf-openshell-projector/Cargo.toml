[package]
name = "apf-openshell-projector"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
apf-bundle      = { path = "../apf-bundle" }
apf-compiler    = { path = "../apf-compiler" }
apf-policy-eval = { path = "../apf-policy-eval" }
apf-proto       = { path = "../apf-proto" }

prost       = "0.13"
prost-types = "0.13"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
