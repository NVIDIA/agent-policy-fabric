[package]
name = "apf-openshell-interceptor"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
apf-openshell-auth = { path = "../apf-openshell-auth" }
apf-proto           = { path = "../apf-proto" }
apf-policy-client   = { path = "../apf-policy-client" }
apf-types           = { path = "../apf-types" }


anyhow        = "1"
hex        = "0.4"
base64        = "0.22"
ed25519-dalek = "2"
jsonwebtoken  = "9"
prost         = "0.13"
prost-types   = "0.13"
rand          = { version = "0.8", features = ["getrandom"] }
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
serde_yaml    = "0.9"
sha2          = "0.10"
thiserror     = "2"
tokio         = { version = "1", features = ["full"] }
tonic         = { version = "0.12", features = ["channel", "tls"] }
tracing       = "0.1"
uuid          = { version = "1", features = ["v4"] }

[dev-dependencies]
jsonwebtoken = "9"
rand         = { version = "0.8", features = ["getrandom"] }
