[package]
name = "apf-policy-gateway"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "apf-policy-gateway"
path = "src/main.rs"

[dependencies]
apf-bundle                  = { path = "../apf-bundle" }
apf-compiler                = { path = "../apf-compiler" }
apf-policy-eval             = { path = "../apf-policy-eval" }
apf-proto                   = { path = "../apf-proto" }
apf-types                   = { path = "../apf-types" }
apf-policy-client           = { path = "../apf-policy-client" }
apf-openshell-interceptor   = { path = "../apf-openshell-interceptor" }
apf-openshell-middleware    = { path = "../apf-openshell-middleware" }

arc-swap           = "1"
prost              = "0.13"
tokio              = { version = "1", features = ["full"] }
tonic              = { version = "0.12", features = ["channel"] }
anyhow             = "1"
clap               = { version = "4", features = ["derive", "env"] }
thiserror          = "2"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nix                = { version = "0.29", features = ["socket", "user"] }
tokio-stream       = "0.1"
jsonwebtoken       = "9"
base64             = "0.22"
ed25519-dalek      = { version = "2", features = ["rand_core"] }
reqwest            = { version = "0.12", features = ["json"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
