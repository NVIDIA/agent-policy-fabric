[package]
name = "apf-proto"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
prost         = "0.13"
prost-reflect = { version = "0.14", features = ["serde"] }
prost-types   = "0.13"
serde_json    = "1"
sha2          = "0.10"
hex           = "0.4"
tonic       = { version = "0.12", features = ["channel"] }

[build-dependencies]
tonic-build = "0.12"
