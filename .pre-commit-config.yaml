repos:
  - repo: local
    hooks:
      - id: verify-copyright
        name: verify-copyright
        description: Add/refresh SPDX copyright and license headers on changed files.
        entry: python3 scripts/verify_copyright.py --fix
        language: system
        # Keep in step with file_type() in scripts/verify_copyright.py.
        files: (\.(rs|proto|py|sh|rules|tpl)|(^|/)Dockerfile(\.[^/]*)?|\.Dockerfile)$
        exclude: ^contracts/third_party/
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
